# CT126 is an unprivileged LXC.  Its daemon runs as container root so Guix can
# assign distinct guixbuilder UIDs; this is not host root.  The stock Guix 1.5
# unit targets a user-namespace daemon with a read-only store bind mount, which
# is not used in this CT.  Keep sandboxed builds enabled (no --disable-chroot).
[Service]
User=root
PrivateMounts=no
BindPaths=
MountFlags=
AmbientCapabilities=
ExecStartPre=
ExecStartPost=
ExecStart=
ExecStart=/var/guix/profiles/per-user/root/current-guix/bin/guix-daemon --build-users-group=guixbuild --max-jobs=1 --cores=3 --discover=no --substitute-urls='https://bordeaux.guix.gnu.org https://ci.guix.gnu.org'
Environment=
Environment=GUIX_STATE_DIRECTORY=/var/guix LC_ALL=C.UTF-8 TMPDIR=/var/tmp
# Bound this service's memory use; these limits do not reserve host memory.
MemoryHigh=4G
MemoryMax=5G
MemorySwapMax=1G
