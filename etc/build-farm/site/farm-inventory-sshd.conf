# Include this file at the END of /etc/ssh/sshd_config, after global settings.
# Debian's default sshd_config.d include is near the top; installing this Match
# block there would accidentally put subsequent global settings inside Match.
Match User farm-inventory
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/bin/python3 /opt/farm-site/receive-manifest.py
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
