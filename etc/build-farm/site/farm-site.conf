server {
    listen 8082 default_server;
    listen [::]:8082 default_server;
    server_name _;
    root /srv/farm-site/public/current;
    index index.html;
    autoindex off;
    charset utf-8;

    # The Evelin server in CT116 connects to this listener on behalf of the VPS.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/securityops-farm-allow.conf;
    deny all;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        return 404;
    }
}
