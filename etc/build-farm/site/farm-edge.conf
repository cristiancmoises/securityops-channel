# Public edge for the static site in CT126, reached over the existing Evelin tunnel.
include /data/nginx/custom/farm-private-upstream.conf;
server {
    listen 80;
    listen [::]:80;
    server_name farm.securityops.co farm.securityops.com.br;
    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name farm.securityops.co;
    ssl_certificate /data/custom_ssl/securityops-farm/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/securityops-farm/privkey.pem;
    include conf.d/include/block-exploits.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://securityops_farm_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
